name: Run GodPrompt Bench

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark profile
        type: choice
        options: [smoke, full]
        default: smoke
        required: true
      model:
        description: Inspect model identifier
        type: string
        default: openai/gpt-5.6-sol
        required: true
      reasoning_effort:
        description: Reasoning effort (must be supported by the selected model)
        type: choice
        options: [none, minimal, low, medium, high, xhigh, max]
        default: medium
        required: true
      reasoning_mode:
        description: Reasoning mode (must be supported by the selected model)
        type: choice
        options: [standard, pro]
        default: standard
        required: true
      seed:
        description: Random seed (must be supported by the selected provider)
        type: string
        default: '7'
        required: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: bench/pyproject.toml

      - name: Require configured OpenAI credential
        if: startsWith(inputs.model, 'openai/')
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'OPENAI_API_KEY secret is required for OpenAI benchmark runs.' >&2
            exit 1
          fi

      - name: Install benchmark
        run: |
          python -m pip install --upgrade pip
          pip install -e './bench[openai]'

      - name: Build isolated task sandbox
        run: docker compose -f bench/sandbox/compose.yaml build

      - name: Run benchmark
        env:
          BENCH_PROFILE: ${{ inputs.profile }}
          BENCH_MODEL: ${{ inputs.model }}
          BENCH_SEED: ${{ inputs.seed }}
          BENCH_REASONING_EFFORT: ${{ inputs.reasoning_effort }}
          BENCH_REASONING_MODE: ${{ inputs.reasoning_mode }}
        run: |
          python -m godprompt_bench.run \
            --profile "$BENCH_PROFILE" \
            --model "$BENCH_MODEL" \
            --seed "$BENCH_SEED" \
            --reasoning-effort "$BENCH_REASONING_EFFORT" \
            --reasoning-mode "$BENCH_REASONING_MODE" \
            --output bench/results

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: godprompt-bench-${{ inputs.profile }}-${{ github.run_id }}
          path: |
            bench/results/*/manifest.json
            bench/results/*/summary.json
            bench/results/*/scores.csv
            bench/results/*/trajectories.jsonl
          if-no-files-found: warn
          retention-days: 30
