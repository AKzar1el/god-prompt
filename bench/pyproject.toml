[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "godprompt-bench"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "inspect-ai==0.3.260",
  # Inspect 0.3.260 imports acp.helpers, which ACP 1.0.0 removed.
  "agent-client-protocol>=0.12.0,<1.0.0",
]

[tool.setuptools]
packages = ["godprompt_bench"]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]
openai = ["openai>=1,<3"]
anthropic = ["anthropic>=0.40,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
